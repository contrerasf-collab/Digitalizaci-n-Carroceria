<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UD3 · Sistemas basados en la nube</title>
<style>
:root{--n:#0b1f3a;--n2:#16345f;--o:#ff7a1a;--g:#eef1f6;--t:#1d2b3f;--ok:#1f9d55;--ko:#d64545}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--g);color:var(--t);display:flex;min-height:100vh}
nav{width:250px;background:var(--n);color:#fff;padding:16px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
nav h1{font-size:15px;margin:0 0 4px}nav small{color:#9fb3d1}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#cfdbef;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;margin:2px 0}
nav button:hover{background:var(--n2)}nav button.on{background:var(--o);color:#fff;font-weight:700}nav button.v::after{content:" ✓";color:#7ee2a8}
.pb{height:8px;background:#26426e;border-radius:6px;margin:12px 0}.pb i{display:block;height:100%;background:var(--o);border-radius:6px;transition:.3s}
main{flex:1;padding:24px;max-width:920px;margin:auto;width:100%;min-width:0}
header.h{background:linear-gradient(120deg,var(--n),var(--n2));color:#fff;border-radius:16px;padding:22px;border-bottom:5px solid var(--o)}
header.h h2{margin:0 0 4px;font-size:26px}header.h p{margin:0;color:#c8d6ee}
.card{background:#fff;border-radius:14px;padding:18px;margin:16px 0;box-shadow:0 2px 8px #0b1f3a14}
.ph{display:inline-block;background:var(--o);color:#fff;font-size:11px;font-weight:800;letter-spacing:1px;padding:3px 10px;border-radius:20px;margin-bottom:8px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
details{background:var(--g);border-radius:10px;padding:10px;border-left:4px solid var(--n2)}summary{cursor:pointer;font-weight:700}
.bt{background:var(--o);color:#fff;border:0;padding:9px 16px;border-radius:8px;font-weight:700;cursor:pointer}
.bt.s{background:var(--n2)}.bt.s2{background:#fff;color:var(--n2);border:2px solid var(--n2);padding:7px 14px}.bt.s2:hover{background:var(--g)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.nb{margin-top:8px;text-align:center;background:var(--n2);color:#fff;border:1px solid #3a5a8c}
.nl{margin-top:10px;text-align:center;font-size:12px;color:#9fb3d1;text-decoration:underline;background:none;border:0;cursor:pointer;width:100%}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--o);outline-offset:2px;box-shadow:0 0 0 2px #fff}
.rv{background:#fff4ea;border-left:4px solid var(--o);padding:10px 14px;border-radius:8px;margin-top:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px;border-radius:8px;margin:4px 0;background:var(--g)}
.row span{flex:1;min-width:200px}
.row.ok{background:#e3f6ea}.row.ko{background:#fde6e6}.row em{flex-basis:100%;font-size:13px}
select,textarea{font:inherit;padding:7px;border:1px solid #b8c4d8;border-radius:8px;width:100%}
select{width:auto;max-width:100%}textarea{min-height:70px}
label{display:block;font-weight:700;margin:10px 0 4px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips b{background:var(--n);color:#fff;padding:8px 12px;border-radius:20px;font-size:13px;font-weight:600}
.chips b.o{background:var(--o)}.ar{font-size:22px;color:var(--o);align-self:center;font-weight:700}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;text-align:center}
.info div{background:var(--n);color:#fff;border-radius:12px;padding:12px 8px;border-top:4px solid var(--o);font-size:12px}
.info div b{display:block;font-size:24px;margin-bottom:4px}
.chk{display:block;padding:6px 0;font-weight:400}.chk input{margin-right:8px}
.fig{margin:16px 0}.fig img{width:100%;border-radius:12px;display:block}.fig figcaption{font-size:13px;color:#5c6b80;margin-top:8px}
.fig .wrap{position:relative}
.mk{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#ff7a1ae0;border:3px solid #fff;color:#fff;font:800 16px system-ui;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #ff7a1a66,0 2px 8px #0006;cursor:pointer;transition:transform .18s,background .25s,box-shadow .25s}
.mk:hover{transform:translate(-50%,-50%) scale(1.1)}
.mk.on{background:var(--c,#1f9d55);box-shadow:0 0 0 4px #ffffffb3,0 2px 8px #0006}
.mk.sel{transform:translate(-50%,-50%) scale(1.16);box-shadow:0 0 0 7px #ffffffd9,0 3px 12px #0008}
.hint{font-size:13px;font-weight:600;color:#5c6b80;margin-bottom:8px}
.mpanel{display:flex;gap:12px;align-items:center;background:#fff4ea;border-left:6px solid var(--o);border-radius:12px;padding:14px;margin-top:12px;min-height:80px;transition:.25s}
.mapbody{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:840px){.mapbody{grid-template-columns:1fr 290px;align-items:start}.mapbody .mpanel{margin-top:0;position:sticky;top:12px}}
.mpanel.on{background:#fff;box-shadow:0 4px 14px #0b1f3a22}
.mpn{width:44px;height:44px;border-radius:50%;background:var(--o);color:#fff;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.25s}
.mpt b{display:block;color:var(--n);font-size:17px;margin-bottom:3px}
.mpt span{font-size:14px;color:#3d4d63;line-height:1.45}
.lvl{background:#f7f9fc;border-radius:12px;padding:12px;margin:14px 0}
.lv{display:flex;align-items:center;gap:12px;background:#fff;border-left:6px solid var(--c);border-radius:10px;padding:11px 12px;margin:8px 0;box-shadow:0 1px 4px #0b1f3a0f}
.ln{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lv b{display:block;color:var(--n);font-size:15px;margin-bottom:2px}
.lv em{font-style:normal;font-size:13px;color:#4a5a70;line-height:1.35}
.lv .tag{flex-shrink:0;font-size:11px;font-weight:800;color:#fff;background:var(--c);padding:4px 8px;border-radius:20px;white-space:nowrap}
.dg{width:100%;height:auto;display:block;background:#f7f9fc;border-radius:12px}
.dg text{font-family:system-ui,Segoe UI,Arial,sans-serif}
.dg .bl{font-size:13px;font-weight:800;fill:#fff;text-anchor:middle}
.dg .smc{font-size:10px;fill:#0b1f3a;opacity:.65;text-anchor:middle}
.dg .bk{font-size:12px;font-weight:800;fill:#0b1f3a}
.dg .bs{font-size:10px;fill:#33455e}
.tw{overflow:auto;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--n);color:#fff;padding:8px;text-align:left;font-weight:600}
td{padding:8px;border-bottom:1px solid #d5dce8;vertical-align:top}
.ctl{display:flex;justify-content:space-between;gap:8px;margin:20px 0;flex-wrap:wrap}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;height:auto;position:static}main{padding:12px}}
</style></head><body>
<nav>
  <h1>UD3 · La nube</h1><small>Taller Mediterráneo</small>
  <div class="pb"><i id="pg"></i></div><small id="pt"></small><div id="mn"></div>
  <button class="bt" style="margin-top:12px;width:100%" onclick="ex()">⬇ Exportar respuestas</button>
  <button class="nb" onclick="exj()">⬇ Exportar JSON</button>
  <button class="nb" onclick="document.getElementById('imp').click()">⬆ Importar JSON</button>
  <input type="file" id="imp" accept=".json,application/json" hidden onchange="imj(this)">
  <button class="nb" onclick="rst()">↻ Reiniciar actividades</button>
  <button class="nl" onclick="wipe()">Borrar toda la unidad</button>
</nav>
<main id="m"></main>
<script>
let S={};try{S=JSON.parse(localStorage.getItem('ud3')||'{}')}catch(e){}
S.v=S.v||[];const B={};let cur=S.cur||0;
const sv0=()=>{try{localStorage.setItem('ud3',JSON.stringify(S))}catch(e){}};
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const P=x=>({k:'p',x}),PH=x=>({k:'ph',x}),C=c=>({k:'cards',c}),RV=(b,x)=>({k:'rev',b,x});
const SEL=(o,i)=>({k:'sel',o,i}),TA=f=>({k:'ta',f}),PIC=(s,a,c)=>({k:'pic',src:s,alt:a,cap:c});
const MAP=(s,a,z,c)=>({k:'map',src:s,alt:a,z,c}),DIA=(svg,c)=>({k:'dia',svg,c});
const LVL=c=>({k:'lvl',c});
const TBL=(h,r)=>({k:'tbl',h,r});

const D=[

/* 1 */
{t:'La nube del taller',s:'Dónde vive todo lo que genera el taller',b:[
PH('UNIDAD 3 · DE QUÉ VAMOS A HABLAR'),
P('En la Unidad 2 vimos que el taller necesita <b>datos</b>: tiempos, averías, fotos, presupuestos. Aquí vamos a ver <b>dónde se guardan</b>, <b>quién los procesa</b> y <b>cuánto tarda</b> en contestar.'),
PIC('img/ud3/ud3_p1_portada.webp','Taller de carrocería al atardecer con una nube de datos sobre el edificio','El taller ya genera datos. La pregunta es dónde viven.'),
{k:'chips',c:['📷 Fotos del golpe','📄 Partes','🚗 Historial','💰 Presupuestos','→','☁ ¿Dónde?']},
P('<b>Marta:</b> «Ya tenemos la recepción digitalizada. Pero si mañana se rompe un móvil, perdemos las fotos de tres coches.»'),
TA(['¿Dónde crees que debería estar toda la información del taller? ¿En el taller o fuera? Tu primera opinión:'])]},

/* 2 */
{t:'Los datos están en cinco sitios',s:'El problema, tal como está hoy',b:[
PH('PROBLEMA'),
P('Álex hace la cuenta: las fotos están en tres móviles, los partes en papel, el historial en un pen drive, los presupuestos en el correo y las citas en el cuaderno.'),
C([['📱 Tres móviles','Fotos del golpe hechas por cada técnico, sin nombre ni matrícula.'],['📄 Partes en papel','Se mojan, se pierden y nadie sabe si están cobrados.'],['💾 Un pen drive','El historial de cinco años en el bolsillo de un pantalón.'],['📧 Correo y mensajes','Presupuestos aprobados por WhatsApp, sin rastro.']]),
PIC('img/ud3/ud3_p2_caos.webp','Mostrador de taller con papeles, archivador, móviles y fotos de coches','Lo que hay hoy encima del mostrador.'),
PH('EXPERIMENTO · ¿DÓNDE ESTÁ CADA COSA?'),
P('Marca dónde vive hoy cada información. No es una opinión: es lo que hay.'),
SEL(['Solo en el taller','En la nube'],[
['Las fotos del móvil de Marta',0,'No han salido del teléfono: si se rompe, se pierden.'],
['Los partes de trabajo en papel',0,'Están en el mostrador. Una ventana abierta y adiós.'],
['Los presupuestos enviados por correo',1,'El correo sí está en la nube: se puede recuperar desde cualquier sitio.'],
['El historial del pen drive',0,'Un solo sitio, sin copia, y en un objeto que se pierde.'],
['El grupo de mensajes del taller',1,'Los mensajes viven en servidores del proveedor.'],
['La facturación del ordenador del despacho',0,'Si falla el disco, no hay facturas.']]),
RV('Lo que está pasando','La información no está mal guardada: está <b>repartida</b>. Y lo que está en un solo sitio, se pierde con ese sitio.'),
TA(['¿Qué problemas concretos puede causar tener la información así repartida?'])]},

/* 3 */
{t:'La nube no está en el aire',s:'Qué es realmente el cloud',b:[
PH('EXPERIMENTO MENTAL'),
P('«Lo tengo en la nube». Vale. ¿Dónde está exactamente?'),
C([['📍 No está en tu móvil','Si lo ves desde otro teléfono, no puede estar solo en el tuyo.'],['🏢 Son ordenadores de otros','Máquinas guardadas en naves enormes: los centros de datos.'],['💡 Naves que no duermen','Luz, aire acondicionado, baterías y vigilancia las 24 horas.'],['🌍 Puede estar en otro país','Por eso importa saber dónde se guardan los datos de tus clientes.']]),
P('La nube no es magia: es <b>alquilar ordenadores</b> que están en otro sitio y llegar a ellos por internet.'),
PIC('img/ud3/ud3_p3_datacenter.webp','Pasillo de un centro de datos con hileras de servidores','Al final del pasillo no hay nube: hay servidores.'),
PH('EXPERIMENTO · EL TALLER SIN INTERNET'),
P('Son las 9:00 de un martes. El router del taller se ha caído y no hay cobertura. ¿Qué puedes seguir haciendo?'),
SEL(['Sigue funcionando','Se para'],[
['Diagnosticar un coche con el equipo conectado por cable',0,'El equipo y el coche están ahí: no necesita internet.'],
['Consultar el historial de un vehículo en la nube',1,'Está en servidores remotos: sin red, no hay historial.'],
['Cobrar con el datáfono',1,'Necesita la autorización del banco.'],
['Lijar, masillar y pintar',0,'Es trabajo de taller, no de red.'],
['Enviar el presupuesto al seguro',1,'Sale por internet.'],
['Abrir la puerta del taller con la llave',0,'Sigue siendo una llave.']]),
RV('Lo que acabas de descubrir','Todo lo que depende de internet se para cuando se cae internet. De esa debilidad nacen <b>edge</b> y <b>fog computing</b>: procesar cerca para no depender tanto. Lo verás en la pantalla 11.'),
TA(['¿Qué harías para que un corte de internet no parase el taller?'])]},

/* 4 */
{t:'Seis características',s:'Por qué la nube se impuso',b:[
PH('CONCEPTO'),
{k:'info',c:[['🔁','Bajo demanda'],['🌍','Universal'],['🧩','Pooling'],['📈','Elasticidad'],['💳','Medido'],['🔄','Actualizado']]},
C([['🔁 Acceso bajo demanda','Contratas y usas en el momento, sin comprar máquinas ni esperar instalaciones.'],['🌍 Acceso universal','Desde cualquier dispositivo con internet: el taller, casa o la grúa.'],['🧩 Pooling de recursos','Muchos clientes comparten los mismos servidores del proveedor, que reparte la carga.'],['📈 Escalabilidad y elasticidad','Sube y baja según la demanda, sin comprar hardware.'],['💳 Servicio medido','Se paga por lo que se usa. Si un mes hay poco trabajo, se paga menos.'],['🔄 Actualizaciones automáticas','El proveedor actualiza y mantiene: el taller no instala nada.']]),
PH('ACTIVIDAD · RECONOCE LA CARACTERÍSTICA'),
P('Cada frase describe una característica. Elige cuál.'),
SEL(['Acceso bajo demanda','Acceso universal','Pooling de recursos','Escalabilidad y elasticidad','Servicio medido','Actualizaciones automáticas'],[
['El taller paga cada mes solo por las cuentas que utiliza',4,'Pagar por lo que se usa es el servicio medido.'],
['Marta abre el historial desde casa y Álex a la vez desde el taller',1,'El mismo servicio desde cualquier lugar: acceso universal.'],
['Tras la granizada del verano pasan de 2 a 6 usuarios y luego vuelven a 2',3,'Sube y baja según la demanda: elasticidad.'],
['El proveedor actualiza la aplicación sin que nadie instale nada',5,'Las actualizaciones corren de su cuenta.'],
['Muchos talleres comparten los mismos servidores del proveedor',2,'Recursos compartidos: pooling.'],
['El taller amplía el espacio de fotos en el momento, sin llamar a nadie',0,'Se sirve solo, cuando se pide.']]),
TA(['¿Cuál de las seis te parece la más valiosa para un taller pequeño? ¿Por qué?'])]},

/* 5 */
{t:'Tres niveles: IaaS · PaaS · SaaS',s:'Quién gestiona qué',b:[
PH('LOS TRES NIVELES'),
P('Quien usa la nube no siempre gestiona lo mismo. Hay tres niveles y la diferencia es <b>cuánto pones tú</b>.'),
LVL([
['SaaS · software','Usas la aplicación y ya está: el proveedor pone el servidor, el mantenimiento y las actualizaciones.','#ff7a1a','📱','tú: nada'],
['PaaS · plataforma','Tú escribes el código; el proveedor pone la plataforma para desarrollarlo y desplegarlo.','#2ea8ff','🧑‍💻','tú: el código'],
['IaaS · infraestructura','Alquilas máquinas, red y almacenamiento y encima pones el sistema operativo y los programas.','#16345f','🖥','tú: sistema y apps']]),
P('<small>De arriba abajo el taller gestiona más: en SaaS no montas nada; en IaaS lo montas casi todo.</small>'),
C([['🧾 Ejemplos de IaaS','Amazon EC2 (máquinas virtuales), Google Cloud Storage, Oracle Cloud Database. <b>Salida profesional:</b> administrador de sistemas y redes.'],['🧾 Ejemplos de PaaS','Google App Engine, Heroku. <b>Salida profesional:</b> desarrollador de aplicaciones, ingeniero de DevOps.'],['🧾 Ejemplos de SaaS','Microsoft 365, Dropbox, Salesforce. <b>Salida profesional:</b> especialista en implantación de software y soporte.'],['🚗 ¿Y en tu taller?','Casi todo lo que usa un taller pequeño es <b>SaaS</b>: la app de citas, la de presupuestos, el correo. IaaS y PaaS son para quien desarrolla.']]),
RV('El truco de la cocina','IaaS es alquilar la cocina vacía; PaaS, la cocina con fogones y menaje; SaaS, el plato ya servido.'),
PH('ACTIVIDAD · CLASIFICA'),
P('Coloca cada servicio en su nivel.'),
SEL(['IaaS','PaaS','SaaS'],[
['Amazon EC2 (máquinas virtuales)',0,'Alquilas la máquina y tú pones el sistema operativo: IaaS.'],
['Google Cloud Storage',0,'Almacenamiento contratado como infraestructura: IaaS.'],
['Oracle Cloud Database',0,'Infraestructura de base de datos gestionada: IaaS.'],
['Google App Engine',1,'Plataforma para desplegar tu propio código: PaaS.'],
['Heroku',1,'Plataforma de desarrollo y despliegue: PaaS.'],
['Microsoft 365',2,'Usas la aplicación y ya está: SaaS.'],
['Dropbox',2,'Guardas archivos y los usas desde la aplicación: SaaS.'],
['Salesforce (CRM)',2,'Software de gestión listo para usar: SaaS.']]),
TA(['El programa con el que se valoran los daños en tu taller, ¿de qué nivel sería? Justifícalo.'])]},

/* 6 */
{t:'Pública, privada o híbrida',s:'Dónde vive lo que contratas',b:[
PH('LOS TRES MODELOS'),
P('No todo puede ir al mismo sitio. El expediente del seguro y los datos del cliente no se tratan igual.'),
C([['🌐 Nube pública','Los recursos son de un proveedor externo y se comparten entre clientes. <b>Ventajas:</b> económica, escala sola. <b>Ojo:</b> menos control.'],['🔒 Nube privada','La infraestructura es exclusiva de una organización. <b>Ventajas:</b> control y rendimiento. <b>Ojo:</b> más cara y más trabajo.'],['🔀 Nube híbrida','Combina las dos: lo delicado dentro y lo demás fuera. <b>Ventajas:</b> flexibilidad y resiliencia.']]),
PH('ACTIVIDAD · ¿QUÉ MODELO ES?'),
SEL(['Pública','Privada','Híbrida'],[
['Una aplicación de citas que usan miles de talleres',0,'Recursos compartidos del proveedor: pública.'],
['Los historiales de una mutua de accidentes',1,'Datos muy sensibles en infraestructura exclusiva: privada.'],
['El taller guarda las fotos en la nube y la facturación en su servidor',2,'Mezcla recursos propios y ajenos: híbrida.'],
['Un banco con los datos de sus clientes en su propio centro de datos',1,'Infraestructura exclusiva: privada.'],
['Un taller que empieza: citas en la nube y vídeos del peritaje en su disco',2,'Combina las dos: híbrida.']]),
RV('El caso del Taller Mediterráneo','Marta quiere <b>híbrida</b>: las fotos pesadas y el programa de facturación se quedan en el taller; las citas y los presupuestos van a la nube para verlos desde fuera.'),
TA(['¿Qué datos del taller no subirías nunca a una nube pública? ¿Por qué?'])]},

/* 7 */
{t:'Cómo se organiza por dentro',s:'Una app no es un programa único',b:[
PH('ARQUITECTURA'),
P('La aplicación que gestiona un taller no es un bloque: son piezas pequeñas que se hablan entre ellas.'),
{k:'chips',c:['📱 App','→','🔀 Malla','→','🧩 Citas','🧩 Presupuestos','🧩 Fotos','→','☁ Nube']},
C([['🧩 Microservicios','La aplicación se divide en servicios independientes, cada uno con su función (citas, presupuestos, fotos) y se comunican por interfaces. Si uno falla, los demás siguen.'],['⚡ Serverless (sin servidor)','El código se ejecuta solo cuando ocurre algo: llega una foto, se genera el PDF. No hay servidor encendido esperando, y se paga por uso.'],['🔀 Malla de servicios','Una capa que gestiona la comunicación entre microservicios: reparte, vigila y corta si algo va mal.']]),
P('<b>En el taller:</b> la app de recepción no sabe calcular un presupuesto. Solo se lo pide al servicio de presupuestos. Así puede cambiar el cálculo sin tocar la recepción.'),
PH('ACTIVIDAD · ¿QUÉ ES CADA COSA?'),
SEL(['Microservicios','Serverless','Malla de servicios'],[
['La app se divide en piezas: citas, presupuestos y fotos',0,'Servicios independientes que se comunican: microservicios.'],
['Una función se ejecuta solo cuando llega una foto nueva',1,'Se activa con el evento y desaparece: serverless.'],
['Una capa gestiona cómo se hablan esas piezas',2,'Eso es exactamente la malla de servicios.']]),
RV('¿Por qué se monta así?','Porque un taller no puede parar. Si se cae el servicio de fotos, la app sigue cobrando y citando.'),
TA(['Pon un ejemplo del taller donde separar el sistema en piezas evite que todo se pare a la vez.'])]},

/* 8 */
{t:'Qué se contrata',s:'Los cuatro servicios de la nube',b:[
PH('SERVICIOS EN LA NUBE'),
C([['💾 Almacenamiento','Espacio para guardar: fotos, vídeos, PDF, expedientes. <b>En el taller:</b> las 400 fotos de cada reparación.'],['⚙ Cómputo y procesamiento','Máquinas virtuales, contenedores o funciones para ejecutar programas. <b>En el taller:</b> la app de presupuestos.'],['🌐 Redes y conectividad','Conectar sedes, dar acceso seguro y rápido. <b>En el taller:</b> que la gestoría entre sin abrir puertos.'],['🗄 Bases de datos','Guardar datos ordenados y consultarlos rápido. <b>En el taller:</b> el historial de reparaciones.']]),
PH('ACTIVIDAD · ¿QUÉ SERVICIO NECESITA?'),
SEL(['Almacenamiento','Cómputo y procesamiento','Redes y conectividad','Bases de datos'],[

function R(b,id){B[id]=b;
if(b.k=='p')return`<p>${b.x}</p>`;
if(b.k=='ph')return`<div class="ph">${b.x}</div>`;
if(b.k=='chips')return`<div class="chips">${b.c.map(c=>c=='→'?'<span class="ar">→</span>':`<b>${c}</b>`).join('')}</div>`;
if(b.k=='info')return`<div class="info">${b.c.map(c=>`<div><b>${c[0]}</b>${c[1]}</div>`).join('')}</div>`;
if(b.k=='cards')return`<div class="g">${b.c.map(c=>`<details><summary>${c[0]}</summary><p>${c[1]}</p></details>`).join('')}</div>`;
if(b.k=='rev')return`<button class="bt s" id="b${id}" aria-expanded="false" aria-controls="r${id}" onclick="tr('${id}')">${b.b}</button><div class="rv" id="r${id}" hidden>${b.x}</div>`;
if(b.k=='next')return`<div class="rv"><b>PRÓXIMA MISIÓN:</b> la Unidad 4, las tecnologías habilitadoras 🤖<br>Ya sabemos dónde viven los datos. Ahora toca ver qué los produce.</div>`;
if(b.k=='pic')return`<figure class="fig"><img src="${b.src}" alt="${esc(b.alt)}" loading="lazy"><figcaption>${b.cap}</figcaption></figure>`;
if(b.k=='dia')return`<figure class="fig">${b.svg}<figcaption>${b.c}</figcaption></figure>`;
if(b.k=='tbl')return`<div class="tw"><table><tr>${b.h.map(h=>`<th>${h}</th>`).join('')}</tr>${b.r.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
if(b.k=='lvl')return`<div class="lvl">${b.c.map(x=>`<div class="lv" style="--c:${x[2]}"><span class="ln">${x[3]}</span><div style="flex:1;min-width:0"><b>${x[0]}</b><em>${x[1]}</em></div><span class="tag">${x[4]}</span></div>`).join('')}</div>`;
if(b.k=='map'){const v=S['m'+id]||[];return`<figure class="fig" id="fg${id}"><div class="hint">👆 ${b.c}</div><div class="mapbody"><div class="wrap"><img src="${b.src}" alt="${esc(b.alt)}" loading="lazy">${b.z.map((z,n)=>`<button class="mk${v.includes(n)?' on':''}" style="left:${z[0]}%;top:${z[1]}%;--c:${z[4]||'#ff7a1a'}" onclick="mz('${id}',${n})" aria-label="${esc(z[2])}">${n+1}</button>`).join('')}</div><div class="mpanel" id="pnl${id}" aria-live="polite"><div class="mpn" id="pn${id}">?</div><div class="mpt"><b>Elige un número</b><span>Toca un marcador de la imagen para ver qué hace esa capa con el dato.</span></div></div></div></figure>`}
if(b.k=='sel'){const v=S[id]||[];return`<div id="a${id}">${b.i.map((it,n)=>`<div class="row"><span>${it[0]}</span><select onchange="sv('${id}',${n},this.value)"><option value="">—</option>${b.o.map((o,m)=>`<option value="${m}"${v[n]===String(m)?' selected':''}>${o}</option>`).join('')}</select><em></em></div>`).join('')}<div class="acts"><button class="bt" onclick="ck('${id}')">Comprobar</button><button class="bt s2" onclick="retry('${id}')">↻ Volver a intentarlo</button><b class="sc" aria-live="polite"></b></div></div>`}
if(b.k=='chk'){const v=S[id]||[];return`<div id="a${id}">${b.o.map((o,n)=>`<label class="chk"><input type="checkbox" ${v.includes(n)?'checked':''} onchange="tg('${id}',${n},this.checked)">${o}</label>`).join('')}<div class="acts"><button class="bt s2" onclick="retry('${id}')">↻ Volver a intentarlo</button></div></div>`}
if(b.k=='ta')return`<div id="t${id}">${b.f.map((f,n)=>`<label for="x${id}_${n}">${f}</label><textarea id="x${id}_${n}" oninput="S['${id}_${n}']=this.value;sv0()">${esc(S[id+'_'+n]||'')}</textarea>`).join('')}<div class="acts"><button class="bt s2" onclick="cl('${id}')">Borrar respuesta</button></div></div>`;
return''}

function tr(id){const b=B[id],r=document.getElementById('r'+id),t=document.getElementById('b'+id),o=r.hidden;r.hidden=!o;t.textContent=o?'Ocultar solución':b.b;t.setAttribute('aria-expanded',String(o))}
function mz(id,n){const b=B[id];let v=S['m'+id]||[];if(!v.includes(n))v.push(n);S['m'+id]=v;sv0();
const f=document.getElementById('fg'+id);const z=b.z[n],c=z[4]||'#ff7a1a';
f.querySelectorAll('.mk').forEach((e,i)=>{e.classList.toggle('on',v.includes(i));e.classList.toggle('sel',i===n)});
const p=document.getElementById('pnl'+id),badge=document.getElementById('pn'+id);
p.style.borderLeftColor=c;p.classList.add('on');
badge.style.background=c;badge.textContent=n+1;
p.querySelector('.mpt').innerHTML='<b>'+z[2]+'</b><span>'+z[3]+'</span>';
if(window.innerWidth<840&&p.scrollIntoView)p.scrollIntoView({block:'nearest',behavior:'smooth'})}
function retry(id){delete S[id];sv0();const c=document.getElementById('a'+id);if(!c)return;c.querySelectorAll('select').forEach(e=>e.selectedIndex=0);c.querySelectorAll('input[type=checkbox]').forEach(e=>e.checked=false);c.querySelectorAll('.row').forEach(r=>{r.className='row';const m=r.querySelector('em');if(m)m.textContent=''});const sc=c.querySelector('.sc');if(sc)sc.textContent=''}
function cl(id){if(!confirm('¿Seguro que quieres borrar esta respuesta? No se puede deshacer.'))return;B[id].f.forEach((f,n)=>{delete S[id+'_'+n];const e=document.getElementById('x'+id+'_'+n);if(e)e.value=''});sv0()}
function rst(){if(!confirm('Se borrarán las respuestas de los ejercicios autocorregibles, pero se conservan tus textos y notas. ¿Continuar?'))return;D.forEach((d,i)=>d.b.forEach((b,j)=>{if(b.k=='sel'||b.k=='chk'||b.k=='map')delete S[i+'_'+j]}));sv0();draw()}
function wipe(){if(!confirm('Se borrarán TODOS los ejercicios, textos, notas y el progreso de esta unidad. ¿Continuar?'))return;try{localStorage.removeItem('ud3')}catch(e){}S={v:[]};cur=0;draw();scrollTo(0,0)}
function sv(id,n,v){S[id]=S[id]||[];S[id][n]=v;sv0()}
function tg(id,n,c){let a=S[id]||[];a=a.filter(x=>x!==n);if(c)a.push(n);S[id]=a;sv0()}
function ck(id){const b=B[id],rows=document.querySelectorAll('#a'+id+' .row');let ok=0;const v=S[id]||[];
rows.forEach((r,n)=>{const g=v[n]===String(b.i[n][1]);if(g)ok++;r.className='row '+(g?'ok':'ko');r.querySelector('em').textContent=(g?'✔ ':'✘ ')+b.i[n][2]});
document.querySelector('#a'+id+' .sc').textContent=ok+' / '+rows.length+(ok==rows.length?' 🎉':' · revisa las marcadas')}
function go(i){cur=i;S.cur=i;if(!S.v.includes(i))S.v.push(i);sv0();draw();scrollTo(0,0)}
function draw(){const d=D[cur];
document.getElementById('m').innerHTML=`<header class="h"><small>PANTALLA ${cur+1} DE ${D.length}</small><h2>${d.t}</h2><p>${d.s}</p></header>`+
`<div class="card">${d.b.map((b,j)=>R(b,cur+'_'+j)).join('')}</div>`+
`<div class="card"><label for="nota">📝 Mis notas</label><textarea id="nota" oninput="S['n${cur}']=this.value;sv0()">${esc(S['n'+cur]||'')}</textarea></div>`+
`<div class="ctl"><button class="bt s" ${cur?'':'disabled'} onclick="go(${cur-1})">← Anterior</button><button class="bt" ${cur<D.length-1?'':'disabled'} onclick="go(${cur+1})">Siguiente →</button></div>`;
document.getElementById('mn').innerHTML=D.map((x,i)=>`<button class="${i==cur?'on':''} ${S.v.includes(i)?'v':''}" onclick="go(${i})">${i+1}. ${x.t}</button>`).join('');
const p=Math.round(S.v.length/D.length*100);document.getElementById('pg').style.width=p+'%';document.getElementById('pt').textContent=p+'% completado'}
