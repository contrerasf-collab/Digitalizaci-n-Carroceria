function ld(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{window.IMG2=e.target.result;document.querySelector('#m .rv input').insertAdjacentHTML('afterend','<img src="'+e.target.result+'" style="width:100%;border-radius:12px;margin-top:8px">')};r.readAsDataURL(f)}
function revMk(){document.querySelectorAll('.mk').forEach(e=>e.hidden=false)}
function sv(id,n,v){S[id]=S[id]||[];S[id][n]=v;sv0()}
function tg(id,n,c){let a=S[id]||[];a=a.filter(x=>x!==n);if(c)a.push(n);S[id]=a;sv0()}
function ck(id){const b=B[id],rows=document.querySelectorAll('#a'+id+' .row');let ok=0;const v=S[id]||[];
rows.forEach((r,n)=>{const g=v[n]===String(b.i[n][1]);if(g)ok++;r.className='row '+(g?'ok':'ko');r.querySelector('em').textContent=(g?'✔ ':'✘ ')+b.i[n][2]});
document.querySelector('#a'+id+' .sc').textContent=ok+' / '+rows.length+(ok==rows.length?' 🎉':' · Revisa las marcadas')}
function go(i){cur=i;S.cur=i;if(!S.v.includes(i))S.v.push(i);sv0();draw();scrollTo(0,0)}
function draw(){const d=D[cur];
document.getElementById('m').innerHTML=`<header class="h"><small>PANTALLA ${cur+1} DE ${D.length}</small><h2>${d.t}</h2><p>${d.s}</p></header>`+
`<div class="card">${d.b.map((b,j)=>R(b,cur+'_'+j)).join('')}</div>`+
`<div class="card"><label>📝 Mis notas</label><textarea oninput="S['n${cur}']=this.value;sv0()">${S['n'+cur]||''}</textarea></div>`+
`<div class="ctl"><button class="bt s" ${cur?'':'disabled'} onclick="go(${cur-1})">← Anterior</button><button class="bt" ${cur<D.length-1?'':'disabled'} onclick="go(${cur+1})">Siguiente →</button></div>`;
document.getElementById('mn').innerHTML=D.map((x,i)=>`<button class="${i==cur?'on':''} ${S.v.includes(i)?'v':''}" onclick="go(${i})">${i+1}. ${x.t}</button>`).join('');
const p=Math.round(S.v.length/D.length*100);document.getElementById('pg').style.width=p+'%';document.getElementById('pt').textContent=p+'% completado'}
function ex(){let o='UD2 · Taller Mediterráneo · Mis respuestas\n\n';
D.forEach((d,i)=>{o+='## '+(i+1)+'. '+d.t+'\n';d.b.forEach((b,j)=>{const id=i+'_'+j;
if(b.k=='ta')b.f.forEach((f,n)=>o+=f+'\n  '+(S[id+'_'+n]||'—')+'\n');
if(b.k=='chk')o+='Elegidas: '+(S[id]||[]).map(n=>b.o[n]).join(', ')+'\n';
if(b.k=='sel')b.i.forEach((it,n)=>{const x=(S[id]||[])[n];o+=it[0]+' → '+(x?b.o[x]:'—')+'\n'})});
o+='Notas: '+(S['n'+i]||'—')+'\n\n'});
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o],{type:'text/plain'}));a.download='ud2_respuestas.txt';a.click()}
draw();
