<style>

.row.ok{background:#e3f6ea}.row.ko{background:#fde6e6}.row em{flex-basis:100%;font-size:13px}

label{display:block;font-weight:700;margin:10px 0 4px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips b{background:var(--n);color:#fff;padding:8px 12px;border-radius:20px;font-size:13px}

.dia{background:var(--g);border-left:4px solid var(--o);padding:10px;border-radius:8px;margin:8px 0}

<script>
let S={};try{S=JSON.parse(localStorage.getItem('ud2')||'{}')}catch(e){}
S.v=S.v||[];const B={};let cur=S.cur||0;
const sv0=()=>{try{localStorage.setItem('ud2',JSON.stringify(S))}catch(e){}};
const P=x=>({k:'p',x}),PH=x=>({k:'ph',x}),C=c=>({k:'cards',c}),RV=(b,x)=>({k:'rev',b,x}),SEL=(o,i)=>({k:'sel',o,i}),TA=f=>({k:'ta',f});
const D=[
{t:'La cuarta revolución industrial',s:'Tecnología para transformar las empresas',b:[
PH('PUNTO DE PARTIDA · CONEXIÓN CON LA UD1'),
P('En la Unidad 1 vimos que las empresas quieren mejorar en:'),
{k:'chips',c:['♻ Residuos','⚙ Eficiencia','🗂 Organización','🌱 Sostenibilidad','→','📊 Necesitan INFORMACIÓN']},
PH('PROBLEMA'),
P('Marta y Álex llevan el <b>Taller Mediterráneo</b>. Quieren mejorar, pero siguen con las mismas dificultades:'),
C([['📄 Demasiados papeles','Partes de trabajo, presupuestos y albaranes en carpetas.'],['🔎 Búsqueda lenta','Encontrar el historial de un coche lleva media mañana.'],['😤 Clientes más exigentes','Quieren saber cuándo estará su coche, y ya.'],['🚗 Vehículos más complejos','Sensores, cámaras, electrónica y software.']]),
P('<b>Álex:</b> «Marta, ¿y si la tecnología nos echara una mano?»'),
TA(['¿Puede la tecnología ayudar al taller? Tu primera opinión (luego la revisarás):'])]},
{t:'¿Cómo han evolucionado las empresas?',s:'Cuatro revoluciones, muy resumido',b:[
PH('EXPERIMENTACIÓN · LÍNEA TEMPORAL (pulsa cada revolución)'),
C([['1ª · ~1780 · Vapor','Máquinas movidas por vapor. Se pasa del trabajo a mano a la mecanización.'],['2ª · ~1870 · Electricidad','Energía eléctrica y producción en serie. Cadena de montaje de Ford.'],['3ª · ~1970 · Electrónica','Ordenadores y autómatas (PLC). Robots industriales en las fábricas.'],['4ª · hoy · Datos e inteligencia','Máquinas conectadas que generan datos y ayudan a decidir.']]),
PH('ACTIVIDAD'),P('Relaciona cada invento con su revolución.'),
{...SEL(['1ª','2ª','3ª','4ª'],[['Telar movido por máquina de vapor',0,'Es mecanización: 1ª revolución.'],['Cadena de montaje del Ford T',1,'Producción en serie con electricidad: 2ª.'],['Autómata programable (PLC) en una fábrica',2,'Electrónica y automatización: 3ª.'],['Coche que envía datos de su estado por internet',3,'Datos y conectividad: 4ª.'],['Ordenador en la oficina del taller',2,'Informática: 3ª.']])}]},
{t:'¿Qué hace diferente a la Industria 4.0?',s:'Cuatro ideas clave',b:[
PH('CONCEPTO CLAVE'),
{k:'info',c:[['📊','Datos'],['📡','Conectividad'],['🤖','Automatización'],['🧠','Inteligencia']]},
C([['📊 Datos','Registrar lo que ocurre: tiempos, averías, piezas. Ejemplo: el escáner guarda el código de error.'],['📡 Conectividad','Que máquinas y personas se comuniquen. Ejemplo: la cabina de pintura avisa al móvil del jefe.'],['🤖 Automatización','Que una máquina haga tareas repetitivas. Ejemplo: un robot aplica el sellador siempre igual.'],['🧠 Inteligencia','Que el sistema analice y proponga. Ejemplo: avisa de qué pieza fallará pronto.']]),
PH('ACTIVIDAD · CLASIFICA'),
SEL(['Datos','Conectividad','Automatización','Inteligencia'],[['Anotar el tiempo de cada reparación',0,'Registrar información = datos.'],['La cabina de pintura envía su estado al móvil del jefe',1,'Comunicación entre máquina y persona = conectividad.'],['Un robot aplica el sellador siempre igual',2,'Tarea repetitiva hecha por máquina = automatización.'],['El sistema sugiere qué pieza se romperá pronto',3,'Analiza y predice = inteligencia.'],['El presupuesto se calcula solo comparando miles de reparaciones',3,'Aprende de datos anteriores = inteligencia.']])]},
{t:'Los datos: el nuevo recurso',s:'Sin datos no hay mejora',b:[
PH('PROBLEMA'),P('Álex dice: «Si no medimos nada, ¿cómo sabemos dónde perdemos tiempo?»'),
PH('EXPERIMENTACIÓN'),P('Un taller genera datos cada día. ¿Cuáles de estas cosas lo son?'),
SEL(['Sí','No'],[['Fotos del golpe al recibir el coche',0,'Sí: son datos (imágenes).'],['Matrícula y teléfono del cliente',0,'Sí: datos de clientes.'],['Horas que tarda cada reparación',0,'Sí: datos de tiempos de trabajo.'],['Pedidos de piezas',0,'Sí: datos de piezas.'],['El color de la camiseta del mecánico',1,'No aporta nada útil para mejorar el taller.'],['Códigos de avería leídos con el equipo de diagnosis',0,'Sí: datos de averías.']]),
PH('CONCEPTO'),P('<b>Dato</b>: un hecho sin interpretar (ej. «3,5 h»). <b>Información</b>: el dato con sentido («esta reparación tarda 1 h más que la media»).'),
PH('APLICACIÓN'),RV('¿Por qué tienen valor?','Porque con ellos se detectan retrasos, se calculan presupuestos mejores, se prevé qué piezas pedir y se demuestra el trabajo hecho al cliente y al seguro.')]},
{t:'Inteligencia artificial',s:'Experimento: peritar daños con fotos',b:[
PH('PROBLEMA'),P('Llegan fotos de un vehículo siniestrado. Hay que decidir rápido qué se repara.'),
PH('EXPERIMENTO'),P('Marca en el coche los puntos donde detectes daños reales y pulsa Comprobar.'),{k:'car'},
RV('¿Cómo lo haría una IA?','Se le enseñan miles de fotos de daños ya peritados. Aprende a reconocer patrones (abolladuras, rayones, faros rotos) y luego los detecta en fotos nuevas.'),
PH('CONCEPTO'),C([['🧠 Inteligencia artificial','Sistemas que realizan tareas que parecen propias de la inteligencia humana: reconocer imágenes, entender texto, decidir.'],['📚 Aprendizaje automático','La IA aprende ella sola a partir de muchos ejemplos, en lugar de seguir reglas escritas una a una.']]),
PH('APLICACIÓN AL TALLER'),C([['Peritación','Detecta daños en fotos y propone piezas y horas.'],['Presupuestos','Estima el coste comparando casos parecidos.'],['Atención al cliente','Chat que responde dudas y estado de la reparación.'],['Predicción de averías','Avisa de fallos antes de que ocurran.']]),
TA(['Una IA puede equivocarse. ¿Quién debería revisar su resultado y por qué?'])]},
{t:'Internet de las cosas (IoT)',s:'Experimento: el vehículo que habla',b:[
PH('PROBLEMA'),P('Un vehículo moderno muestra esto en la pantalla:'),{k:'chips',c:['🛞 Neumáticos 2,3 bar','📍 GPS: Málaga','🌡 Motor 92 ºC','🔋 Batería 12,6 V']},
PH('EXPERIMENTO · ¿de dónde sale cada dato?'),
SEL(['Sensor de presión (TPMS)','Receptor GPS','Sensor de temperatura','Sensor de tensión de la batería'],[['Presión de neumáticos',0,'Un sensor en cada rueda.'],['Posición del vehículo',1,'El receptor GPS la calcula con satélites.'],['Temperatura del motor',2,'Sensor de temperatura del refrigerante.'],['Estado de la batería',3,'Se mide la tensión y la carga.']]),
PH('CONCEPTO'),C([['📡 IoT','Objetos con sensores y conexión que envían datos por internet sin que nadie los escriba.'],['🔬 Sensor','Mide algo físico (presión, temperatura…) y lo convierte en un dato.']]),
PH('APLICACIÓN'),C([['Diagnosis remota','Se leen averías sin tener el coche en el taller.'],['Seguimiento de vehículos','Flotas y grúas localizadas en tiempo real.'],['Mantenimiento predictivo','Se cambia la pieza antes de que falle.']])]},
{t:'Cloud computing',s:'¿Dónde están realmente tus datos?',b:[
PH('PROBLEMA'),P('Usas Google Fotos, Google Classroom y el correo electrónico desde cualquier dispositivo.'),
PH('EXPERIMENTO · ¿dónde se guarda?'),
SEL(['En mi móvil','En servidores remotos (la nube)'],[['Tus fotos en Google Fotos',1,'Están en servidores de la empresa, por eso las ves desde otro móvil.'],['Tus tareas en Google Classroom',1,'Nube: accesibles desde cualquier lugar.'],['Tu correo electrónico',1,'Guardado en servidores del proveedor.'],['Una foto recién hecha, aún sin sincronizar',0,'Hasta que se sube, solo está en tu móvil.']]),
PH('CONCEPTO'),P('<b>Cloud</b>: usar almacenamiento y programas que están en servidores remotos, a los que accedes por internet.'),
PH('APLICACIÓN AL TALLER'),C([['Historiales','Todo el historial del coche, accesible al instante.'],['Fotografías','Fotos del daño guardadas y ligadas al expediente.'],['Presupuestos','Se envían y se aprueban en línea.'],['Documentación','Manuales y partes sin papeles.']]),
P('<small>Solo una introducción: tendrá una unidad propia.</small>')]},
{t:'Robots y automatización',s:'¿Persona, robot o ambos?',b:[
PH('PROBLEMA'),P('En producción y reparación hay tareas muy distintas. ¿A quién le tocan?'),
SEL(['Persona','Robot','Ambas'],[['Diagnosticar un ruido raro del vehículo',0,'Requiere criterio y experiencia.'],['Soldadura por puntos repetitiva en línea de montaje',1,'Repetitiva y precisa: ideal para robot.'],['Atender a un cliente preocupado',0,'Trato humano.'],['Atornillar la misma pieza miles de veces',1,'Automatizable.'],['Levantar una puerta pesada y colocarla con precisión',2,'Un cobot sostiene el peso y la persona guía.'],['Lijar y pulir grandes superficies con supervisión',2,'El robot trabaja y la persona controla la calidad.']]),
PH('CONCEPTO'),C([['⚙ Automatización','Que una máquina haga sola una tarea o proceso.'],['🤖 Robot','Máquina programable que ejecuta movimientos (soldar, pintar, mover piezas).'],['🤝 Cobot','Robot colaborativo que trabaja junto a la persona, sin jaulas, y se detiene si hay contacto.']]),
P('Ejemplos en automoción: robots de soldadura y pintura en fábricas, cobots en atornillado, brazos de lijado en talleres avanzados.')]},
{t:'Las tecnologías trabajan juntas',s:'Un vehículo conectado, paso a paso',b:[
PH('PROBLEMA'),P('Ninguna tecnología sirve sola. Veamos un vehículo conectado:'),
{k:'chips',c:['📡 IoT: obtiene datos','→','☁ Cloud: guarda datos','→','🧠 IA: analiza datos','→','👤 Persona: decide']},
PH('ACTIVIDAD · RELACIONA'),
SEL(['IoT','Cloud','IA','Persona'],[['Los sensores miden presión y temperatura',0,'Captan datos del mundo físico.'],['Los datos se guardan para consultarlos desde cualquier sitio',1,'Almacenamiento remoto.'],['Se detectan patrones que anuncian una avería',2,'Análisis de muchos datos.'],['Se decide citar al cliente y qué reparar',3,'La decisión final es humana.']]),
RV('Idea clave','IoT recoge, Cloud almacena, IA analiza y la persona decide. Quita una pieza y la cadena se rompe.')]},
{t:'La transformación del trabajo',s:'Cómo cambia la forma de trabajar',b:[
PH('PROBLEMA'),P('Marta no puede estar siempre en el taller y Álex necesita aprobar cosas al momento.'),
C([['🤝 Colaboración digital','Varias personas trabajan sobre el mismo documento o parte de trabajo a la vez.'],['🕒 Flexibilidad','Se organiza el trabajo por tareas y objetivos, no solo por horario.'],['💬 Comunicación','Mensajes, videollamadas y avisos al cliente desde el móvil.'],['🏠 Trabajo híbrido','Administración y atención al cliente pueden ser remotas; la reparación es presencial.']]),
TA(['¿Qué tareas de un taller podrían hacerse a distancia y cuáles no? ¿Por qué?'])]},
{t:'El profesional del futuro',s:'Reflexión guiada',b:[
PH('PREGUNTA'),P('¿Qué necesitará aprender un trabajador dentro de diez años? Elige las 3 que consideres más importantes.'),
{k:'chk',o:['Interpretar datos','Manejar equipos de diagnosis','Trabajar con IA','Comunicarse con clientes','Seguridad informática','Trabajo en equipo digital','Aprender continuamente','Habilidad manual de carrocería']},
TA(['Justifica tu elección:'])]},
{t:'Misión: Taller Mediterráneo',s:'Caso práctico',b:[
PH('LA MISIÓN'),P('Marta y Álex te piden ayuda. Estos son los problemas reales del taller:'),
C([['⏱ Retrasos','Los coches se entregan tarde y nadie sabe en qué fase está cada uno.'],['🗂 Documentación dispersa','Papeles, correos y fotos en distintos sitios.'],['📞 Atención al cliente mejorable','Los presupuestos tardan días y los clientes llaman sin parar.'],['🔍 Dificultad de seguimiento','No se sabe qué vehículo está en qué zona ni cuánto lleva parado.']]),
P('<b>Tu objetivo:</b> decidir qué tecnología ataca cada problema.')]},
{t:'Elige las tecnologías adecuadas',s:'Cada problema, su herramienta',b:[
SEL(['IA','IoT','Cloud','Robótica','Datos'],[['Retrasos: no se sabe qué fase tarda más',4,'Medir tiempos por fase (datos) revela dónde se pierde el tiempo.'],['Documentación dispersa en papeles y carpetas',2,'Cloud: un único lugar accesible para todos.'],['Presupuestos lentos a partir de fotos',0,'IA: analiza las imágenes y propone una valoración.'],['No se sabe dónde está cada vehículo ni cuánto lleva parado',1,'IoT: etiquetas y sensores localizan y avisan.'],['Lijado repetitivo que cansa al equipo',3,'Robótica: un cobot asume la tarea repetitiva.']]),
TA(['Elige un problema y justifica tu tecnología. ¿Podría valer otra? ¿Por qué?'])]},
{t:'Diseña una propuesta',s:'Evidencia principal de la unidad',b:[
P('Redacta una propuesta breve para Marta y Álex. Se guarda sola.'),
TA(['1. Problema detectado','2. Tecnología elegida','3. Aplicación concreta en el taller','4. Beneficios esperados'])]},
{t:'Reflexión final',s:'La gran conclusión',b:[
PH('PREGUNTA'),P('¿Funcionan todas estas tecnologías sin información?'),
TA(['Tu respuesta:']),
RV('Ver conclusión','No. IoT, IA, robots y automatización dependen de datos. Y esos datos hay que guardarlos y compartirlos.'),
P('La Industria 4.0 se apoya en <b>datos, conectividad, automatización e inteligencia</b>.'),
TA(['¿Dónde almacena una empresa miles de fotografías, documentos y registros?']),
{k:'next'}]}
];
function R(b,id){B[id]=b;
if(b.k=='p')return`<p>${b.x}</p>`;
if(b.k=='ph')return`<div class="ph">${b.x}</div>`;
if(b.k=='chips')return`<div class="chips">${b.c.map(c=>c=='→'?'<span class="ar">→</span>':`<b>${c}</b>`).join('')}</div>`;
if(b.k=='info')return`<div class="info">${b.c.map(c=>`<div><b>${c[0]}</b>${c[1]}</div>`).join('')}</div>`;
if(b.k=='cards')return`<div class="g">${b.c.map(c=>`<details><summary>${c[0]}</summary><p>${c[1]}</p></details>`).join('')}</div>`;
if(b.k=='rev')return`<button class="bt s" onclick="this.nextElementSibling.hidden=false;this.hidden=true">${b.b}</button><div class="rv" hidden>${b.x}</div>`;
if(b.k=='next')return`<div class="rv"><b>PRÓXIMA MISIÓN:</b> la nube y los servicios cloud ☁<br>Toda esa información necesita almacenarse y compartirse.</div>`;
if(b.k=='sel'){const v=S[id]||[];return`<div id="a${id}">${b.i.map((it,n)=>`<div class="row"><span>${it[0]}</span><select onchange="sv('${id}',${n},this.value)"><option value="">—</option>${b.o.map((o,m)=>`<option value="${m}"${v[n]===String(m)?' selected':''}>${o}</option>`).join('')}</select><em></em></div>`).join('')}<button class="bt" onclick="ck('${id}')">Comprobar</button> <b class="sc"></b></div>`}
if(b.k=='chk'){const v=S[id]||[];return`<div>${b.o.map((o,n)=>`<label class="chk"><input type="checkbox" ${v.includes(n)?'checked':''} onchange="tg('${id}',${n},this.checked)">${o}</label>`).join('')}</div>`}
if(b.k=='ta')return b.f.map((f,n)=>`<label>${f}</label><textarea oninput="S['${id}_${n}']=this.value;sv0()">${S[id+'_'+n]||''}</textarea>`).join('');
if(b.k=='car'){const v=S[cur+'_car']||[];return`<svg viewBox="0 0 300 130" style="max-width:420px;width:100%;background:#eef1f6;border-radius:12px"><path d="M15 90V70q0-14 14-18l30-8 28-22h80l32 22 62 8q12 3 12 16v22z" fill="#8fa3bd"/><circle cx="70" cy="95" r="16" fill="#0b1f3a"/><circle cx="235" cy="95" r="16" fill="#0b1f3a"/>${Z.map((z,n)=>`<circle class="z${v.includes(n)?' on':''}" id="z${n}" cx="${z[0]}" cy="${z[1]}" r="13" onclick="zt(${n})"><title>${z[2]}</title></circle>`).join('')}</svg><br><button class="bt" onclick="zc()">Comprobar</button> <b id="zr"></b>`}
return''}
const Z=[[110,78,'Abolladura en puerta',1],[32,68,'Faro roto',1],[245,72,'Rayón en aleta trasera',1],[170,62,'Reflejo de luz',0],[200,100,'Suciedad en el bajo',0]];
function sv(id,n,v){S[id]=S[id]||[];S[id][n]=v;sv0()}
function tg(id,n,c){let a=S[id]||[];a=a.filter(x=>x!==n);if(c)a.push(n);S[id]=a;sv0()}
function ck(id){const b=B[id],rows=document.querySelectorAll('#a'+id+' .row');let ok=0;const v=S[id]||[];
rows.forEach((r,n)=>{const g=v[n]===String(b.i[n][1]);if(g)ok++;r.className='row '+(g?'ok':'ko');r.querySelector('em').textContent=(g?'✔ ':'✘ ')+b.i[n][2]});
document.querySelector('#a'+id+' .sc').textContent=ok+' / '+rows.length+(ok==rows.length?' 🎉':' · Revisa las marcadas')}
function zt(n){const id=cur+'_car';let v=S[id]||[];const k=S[id]=v.includes(n)?v.filter(x=>x!==n):[...v,n];document.getElementById('z'+n).classList.toggle('on');sv0()}
function zc(){const v=S[cur+'_car']||[];let ok=0;Z.forEach((z,n)=>{const e=document.getElementById('z'+n);e.classList.remove('on');if(z[3]&&v.includes(n)){e.classList.add('okz');ok++}else if(v.includes(n))e.classList.add('koz');else if(z[3])e.classList.add('on')});
document.getElementById('zr').textContent=ok+' de 3 daños reales. Verde: acierto · rojo: no era daño · naranja: no lo viste.'}
function go(i){cur=i;S.cur=i;if(!S.v.includes(i))S.v.push(i);sv0();draw();scrollTo(0,0)}
function draw(){const d=D[cur];
